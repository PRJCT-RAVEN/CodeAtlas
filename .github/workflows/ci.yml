name: ci

on:
  push:
    branches: [main]
  pull_request:
  # An advisory published today applies to a lockfile nobody has touched in months, so
  # the audit gate has to run on a clock, not only on a commit. Only `audit` runs then.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  viewer:
    name: viewer (vitest, ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - name: Typecheck and production build
        run: npm run build
        working-directory: viewer

  tools:
    name: tools (node --test, ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tools suite reaches outside tools/: fs2ir and schema2ir shell out to
      # schema/validate.mjs (which imports ajv), and the launcher test starts the real
      # viewer (which needs vite). Install both here. The launcher used to install them
      # itself on the first `start`, which raced the other test files and lost; the test
      # now asserts they are present instead of creating them.
      - run: npm ci
        working-directory: viewer
      - run: npm ci
        working-directory: schema
      - run: npm ci
        working-directory: tools
      # One run, gated twice. A suite that ran ZERO tests exits 0 — exactly what the old
      # single-quoted glob did under cmd.exe — and nothing else would catch it. Running
      # `npm test` a second time just to grep it doubled the job for no extra coverage.
      - name: the tools suite runs, and actually runs tests
        shell: pwsh
        working-directory: tools
        run: |
          $out = (npm test 2>&1 | Out-String)
          Write-Host $out
          if ($out -match "# tests 0\b") { throw "the tools suite ran ZERO tests" }
          if ($out -notmatch "# fail 0") { throw "the tools suite reported failures" }

  schema:
    name: schema (validator tests, ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: schema
      # One run, gated twice. A suite that ran ZERO tests exits 0 — exactly what the old
      # single-quoted glob did under cmd.exe — and nothing else would catch it. Running
      # `npm test` a second time just to grep it doubled the job for no extra coverage.
      - name: the schema suite runs, and actually runs tests
        shell: pwsh
        working-directory: schema
        run: |
          $out = (npm test 2>&1 | Out-String)
          Write-Host $out
          if ($out -match "# tests 0\b") { throw "the schema suite ran ZERO tests" }
          if ($out -notmatch "# fail 0") { throw "the schema suite reported failures" }

  package:
    name: package (shipped artifacts)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Two manifests carry the plugin version and nothing keeps them equal: marketplace.json
      # duplicates what plugin.json says, and `claude plugin validate` only checks the
      # marketplace shape, so a skew ships silently and every bug report names the wrong build.
      - name: Plugin manifests agree on the version
        run: |
          node -e '
            const p = require("./.claude-plugin/plugin.json");
            const m = require("./.claude-plugin/marketplace.json");
            const entry = (m.plugins || []).find((x) => x.name === p.name);
            if (!entry) throw new Error("marketplace.json lists no plugin named " + p.name);
            if (entry.version !== p.version) {
              throw new Error("version skew: plugin.json " + p.version + " vs marketplace.json " + entry.version);
            }
            // anchored: the unanchored form accepted "0.3.0.1" and "0.3.0-oops-typo"
            if (!/^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/.test(p.version)) throw new Error("not a semver version: " + p.version);
          '
      - run: npm ci
        working-directory: schema
      - name: Every shipped graph validates
        run: node schema/validate.mjs viewer/public/sample-graph.json docs/examples/*.graph.json
      # Two arms: POSIX home paths, and Windows profile paths whose user name is not one of
      # the placeholders the tests and SKILL.md use (`u`, `First Last`, `<user>`). Each
      # pattern is written so that this file does not match itself.
      - name: No personal paths in shipped files
        run: |
          fail=0
          if git ls-files | xargs grep -l '/Users/[a-z]' 2>/dev/null; then
            echo "::error::a shipped file contains an absolute personal path"; fail=1
          fi
          names=$(git ls-files | xargs grep -ohE '[A-Za-z]:\\+[Uu]sers\\+[^\\[:space:]"'"'"'`|);]+' 2>/dev/null \
            | sed -E 's/^[A-Za-z]:\\+[Uu]sers\\+//' | sort -u | grep -vxE 'u|First|<user>' || true)
          if [ -n "$names" ]; then
            echo "::error::a shipped file contains a Windows profile path for: $names"; fail=1
          fi
          exit $fail
      - name: Launcher shims are executable and LF where they must be
        run: |
          test -x scripts/codeatlas-viewer || { echo "::error::scripts/codeatlas-viewer is not executable"; exit 1; }
          file scripts/codeatlas-viewer | grep -q CRLF && { echo "::error::POSIX shim has CRLF line endings"; exit 1; }
          node scripts/codeatlas-viewer.mjs paths > /dev/null

  windows-shim:
    name: windows (.cmd shim + line endings)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shims survived the checkout with the right line endings
        shell: pwsh
        run: |
          $sh = [IO.File]::ReadAllText("scripts/codeatlas-viewer")
          if ($sh.Contains("`r`n")) { throw "scripts/codeatlas-viewer must be LF (see .gitattributes)" }
          $cmd = [IO.File]::ReadAllText("scripts/codeatlas-viewer.cmd")
          if (-not $cmd.Contains("`r`n")) { throw "scripts/codeatlas-viewer.cmd must be CRLF" }
      - name: the .cmd shim runs
        shell: cmd
        run: scripts\codeatlas-viewer.cmd paths

  audit:
    name: audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # These lockfiles are not a build detail: the launcher reproduces them verbatim with
      # `npm ci --omit=dev` on every user's machine (scripts/codeatlas-viewer.mjs), so an advisory
      # in one ships until someone refreshes it. --omit=dev audits the tree a USER ends up running,
      # which is why vite and @vitejs/plugin-react are dependencies of viewer/ and not
      # devDependencies — the daemon we ship is vite. `npm audit` reads the lockfile, so
      # none of this needs an install.
      - name: viewer
        run: npm audit --audit-level=high --omit=dev
        working-directory: viewer
      - name: schema
        run: npm audit --audit-level=high --omit=dev
        working-directory: schema
      # tools/ declares no `dependencies` at all, so --omit=dev here would audit nothing
      # and pass whatever advisory landed on playwright. Nothing in tools/ ships to a user
      # (it is the screenshot/dev kit), so the whole tree is the right scope.
      - name: tools (dev tree — nothing here ships)
        run: npm audit --audit-level=high
        working-directory: tools
